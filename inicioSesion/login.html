<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="encabezado-principal">
        <div class="contenedor-logo">
            <a href="/inicio/inicio.html" class="enlace-logo">
                <h1 class="titulo-empresa">Acceso Seguro</h1>
                <span class="subtitulo-empresa">Soluciones de control de acceso y asistencia</span>
            </a>
        </div>

        <nav class="navegacion-principal">
            <ul>
                <li><a href="/inicio/inicio.html" class="enlace-nav">Inicio</a></li>
                <li><a href="/registro/registro.html" class="enlace-nav ">Control Entradas-Salidas</a></li>
                <li><a href= "/inicioSesion/login.html" class="enlace-nav activo">Iniciar Sesión</a></li>
                <li><a href="/creacionCuentas/creacion.html" class="enlace-nav">Crear Cuenta</a></li>
            </ul>
        </nav>
        <img src="/img/Logo2.png" alt="Logo Acceso Seguro" class="img-logo">
    </header>

    <div class="container">
        <h1>Inicio de Sesión</h1>

        <form id="loginForm">
            <div class="form-group">
                <input type="text" id="username" placeholder="Nombre de usuario" required>
            </div>

            <div class="form-group">
                <input type="password" id="password" placeholder="Contraseña" required>
            </div>

            <div class="recordar">
                <a href="/recuperarContra/index.html">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn-enviar">Iniciar Sesion</button>
        </form>

        <div class="registro">
            ¿No tienes una cuenta? <a href="/creacionCuentas/creacion.html">Regístrate</a>
        </div>
    </div>
    <script src="script.js"></script>

</body>
</html>
