<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creacion de Cuentas</title>
    <link rel="stylesheet" href="creacion.css">
</head>
<body>
    <header class="encabezado-principal">
        <div class="contenedor-logo">
            <a href="index.html" class="enlace-logo">
                <h1 class="titulo-empresa">Acceso Seguro</h1>
                <span class="subtitulo-empresa">Soluciones de control de acceso y asistencia</span>
            </a>
        </div>

        <nav class="navegacion-principal">
            <ul>
                <li><a href="index.html" class="enlace-nav">Inicio</a></li>
                <li><a href="registro.html" class="enlace-nav destacado">Control Entradas-Salidas</a></li>
                <li><a href="login.html" class="enlace-nav">Iniciar Sesión</a></li>
                <li><a href="crear_cuenta.html" class="enlace-nav activo">Crear Cuenta</a></li>
            </ul>
        </nav>
    </header>
    <main class="contenedor-rincipal">
        <seccion class="tarjeta-form">
            <header class="encabezado-form">
                <h2 class="class">Crear Nueva Cuenta de Usuario</h2>
                <p>Ingresa los datos solicitados para crear tu cuenta.</p>
            </header>

            <form id="formRegistro" action="#" method="POST" novalidate>
                <fieldset class="seccion-form">
                    <legend>1. Información Personal</legend>

                    <div class="campo-form">
                        <label for="RUN/RUT"<span class="requerido"></span></label>
                        <input 
                            type="text"
                            id="run"
                            name="run"
                            placeholder="123456789 (sin puntos ni guion)"
                            maxlength="9"
                            required>
                        <span class="msj-error" id="error-run"></span>
                    </div>

                    <div class="campos">
                        <div class="campos_columna-media">
                            <label for="Nombre" <span class="requerido"></span></label>
                            <input
                                type="text"
                                id="nombre"
                                name="nombre"
                                placeholder="Ingrese su Nombre"
                                maxlength="30"
                                required>
                            <span class="msj-error" id="error-nombre"></span>
                        </div>
                        <div class="campos_columna-media">
                            <label for="apellido" <span class="requerido"></span></label>
                            <input
                                type="text"
                                id="apellido"
                                name="apellido"
                                placeholder="Ingrese su Apellido"
                                maxlength="40"
                                required>
                            <span class="msj-error" id="error-apellido">*</span>
                        </div>
                        <div class="campos_columna-media">
                            <label for="fechaNacimiento">Fecha de Nacimiento <span class="requerido"></span></label>
                            <input
                                type="date"
                                id="fechaNac"
                                name="fechaNac"
                                required>
                            <span class="msj-error" id="error-fechaNac">*</span>
                        </div>
                        <div class="campos_columna-media">
                        <label for="numTelefono">Número de Telefono <span class="requerido"></span></label>
                        <input
                            type="tel"
                            id="telefono"
                            name="telefono"
                            placeholder="12345678"
                            maxlength="8"
                            required>
                            <label for="msj-error" id="error-Telefono">*</label>
                        </div>
                        <div class="campos_columna-media">
                            <label for="email" <span class="requerido"></span></label
                            <input
                                type="text"
                                id="email"
                                name="email"
                                placeholder="correo.electronico@dominio.com/cl"
                                maxlength="80"
                                required>
                            <label for="msj-error" id="error-email">*</label>
                        </div>
                    </div>

                </fieldset>
            </form>
        </seccion>
    </main>


    
</body>
</html>
